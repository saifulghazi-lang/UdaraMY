[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api3/publicportalapims/apitablehourly"
  to = "https://eqms.doe.gov.my/api3/publicportalapims/apitablehourly"
  status = 200
  force = true
  headers = { Referer = "https://eqms.doe.gov.my/APIMS/main", User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) UdaraMY/1.0" }

[[redirects]]
  from = "/openaq/locations/*"
  to = "https://api.openaq.org/v3/locations/:splat"
  status = 200
  force = true
  headers = { User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) UdaraMY/1.0" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://eqms.doe.gov.my https://asmc.asean.org https://api.openaq.org https://api.open-meteo.com https://air-quality-api.open-meteo.com; font-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

